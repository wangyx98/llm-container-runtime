# What the node has today (the DaemonSet's pipeline, written for Docker): the container log files, read with the Docker JSON parser.
[INPUT]
    Name              tail
    Tag               kube.*
    Path              /tmp/bench67480710/var/log/containers/*.log
    Parser            docker
    Read_from_Head    On
    Refresh_Interval  5
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
