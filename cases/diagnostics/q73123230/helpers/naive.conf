# What the question starts from: the container logs read with the Docker (JSON) parser and no multiline handling.
[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  /tmp/bench73123230/.bench/naive-parsers.conf

[INPUT]
    Name            tail
    Path            /tmp/bench73123230/logs/*.log
    Tag             cri.*
    Read_from_Head  On
    Parser          docker

[OUTPUT]
    Name            http
    Match           *
    Host            127.0.0.1
    Port            19873
    URI             /logs
    Format          json_lines
    net.keepalive   Off
