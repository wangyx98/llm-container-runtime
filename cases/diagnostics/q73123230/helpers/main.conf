# The lab's configuration of Fluent Bit (classic format). Do not change it: the pipeline (inputs and filters) is in pipeline.conf, the parsers in
# parsers.conf, both beside it; the output is the lab's local JSON collector.
[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  /tmp/bench73123230/fluent-bit/parsers.conf

@INCLUDE /tmp/bench73123230/fluent-bit/pipeline.conf

[OUTPUT]
    Name            http
    Match           *
    Host            127.0.0.1
    Port            19873
    URI             /logs
    Format          json_lines
    net.keepalive   Off
