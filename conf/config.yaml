# Global configuration for the containerd/runtime LLM benchmark harness.
# Loaded by src/cfg_reader/primary.py and passed as `cfg` into every
# test_suites/<category>/<case_id>.py run_tests(sample, cfg) call.

# seconds to allow each shell operation (setup/precondition/solution/oracle/cleanup)
timeout: 180

# where samples are read from when no --samples/--fixtures/--generated is given.
# A directory (every *.json below it is read) or a single JSON file.
#   samples/fixtures/<category>/<case_id>.json  hand-written samples that test the oracles
#   samples/generated/*.json                    real LLM outputs (generate_llm_samples.py)
# (the older key `samples_file` is still read if this one is missing)
samples_path: samples/fixtures

# base directory for run outputs; run_benchmark.py appends a timestamp
# subfolder automatically, e.g. results/2026-09-08_00-41-12/results.csv
results_dir: results

# root directory containing one folder per case (setup.sh/precondition.sh/...)
cases_dir: cases
